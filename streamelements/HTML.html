<!-- StreamElements > Overlay > AlertBox > (tipo de alerta) > Custom CSS/HTML/JS > pestaña HTML -->
<div class="clay-alert">
  <!-- aquí aparece el nombre con letras de plastilina -->
  <div id="clay-name" data-name="{{name}}"></div>
  <!-- monto (donaciones, bits, meses de sub) -->
  <div id="clay-amount" data-amount="{{amount}}"></div>
  <!-- mensaje que escribió la persona -->
  <div class="clay-message">{{message}}</div>
</div>
