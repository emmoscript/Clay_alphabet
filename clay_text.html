<!doctype html>
<!--
  Fuente de navegador para OBS: muestra un texto con el alfabeto de plastilina.
    clay_text.html?text=emil_mr09
    &size=90        alto de las mayúsculas en px
    &max=1100       ancho máximo (se achica si no cabe)
    &anim=1         letras cayendo al cargar
    &jitter=1       0 = recto, 2 = muy torcido
    &color=cocoa    bone, cocoa, red, blue, yellow, pink, sage o un hex sin # (5B4743)
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body>
<div id="t"></div>
<script src="glyphs/glyphs.js"></script>
<script src="clay_text.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  ClayText.render(document.getElementById('t'), q.get('text') || 'Hola chat!', {
    size: +(q.get('size') || 90),
    maxWidth: +(q.get('max') || innerWidth * 0.95),
    animate: q.get('anim') === '1',
    jitter: q.has('jitter') ? +q.get('jitter') : 1,
    color: q.get('color') || 'bone',
  });
</script>
</body></html>
